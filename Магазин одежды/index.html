<!DOCTYPE html>
<html class="page" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP.CO</title>
    <link rel="icon" type="image/svg+xml" href="/Icons/Vector.svg">
    <link rel="stylesheet" href="./css/index.css">
    <script defer src="js/index.js" type="module"></script>
</head>
<body class="page__body">
    <header class="header">
        <div class="container header__container">
            <div class="header__burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="header__menu">
                <div class="header__burger">
                    <div class="header__burger">
                        <button class="header__burger-btn" aria-label="Открыть меню" aria-expanded="false" aria-controls="header__menu">
                            <svg class="header__burger-icon" width="24" height="24">
                                <use class="header__burger-icon--btn"  href="./icons/sprite.svg#header__burger"></use>
                            </svg>
                            <svg class="header__cross-icon" width="24" height="24">
                                <use class=".header__cross-icon--btn" href="./icons/sprite.svg#menu-cross"></use>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <a class="header__logo" href="index.html">SHOP.CO</a>
            <nav id="header__menu" class="menu header__menu">
                <ul class="menu__list">
                    <li class="menu__item">
                        <details class="menu__link shop">
                            <summary class="shop__title">
                                Магазин
                                <svg class="shop-arrow-icon">
                                    <use href="./icons/sprite.svg#shop-arrow"></use>
                                </svg>
                            </summary>
                            <ul class="shop__list">
                                <li class="shop__item"><a href="" class="shop__link"></a></li>
                                <li class="shop__item"><a href="" class="shop__link"></a></li>
                                <li class="shop__item"><a href="" class="shop__link"></a></li>
                            </ul>
                        </details></li>
                    <li class="menu__item"><a href="#" class="menu__link">Скидки</a></li>
                    <li class="menu__item"><a href="#" class="menu__link">Новые поступления</a></li>
                    <li class="menu__item"><a href="#" class="menu__link">Бренды</a></li>
                </ul>
            </nav>
            <form class="search header__search" action="/search" method="get">
                <div class="search__wrapper">
                <button type="submit" class="search__btn" aria-label="Найти">
                    <svg width="24px" height="24px">
                        <use class="search__icon" href="./icons/sprite.svg#search"></use>
                    </svg>
                </button>
                <input type="search" name="q" placeholder="Искать товары..." required>
                </div>
            </form>
            <div class="header__controls">
                <button class="header__actions-button">
                     <svg width="24px" height="24px">
                        <use class="header__actions-icon header__actions-icon--search" href="./icons/sprite.svg#search-controls"></use>
                    </svg>
                </button>
                <button class="header__actions-button">
                    <svg width="24px" height="24px">
                        <use class="header__actions-icon" href="./icons/sprite.svg#basket"></use>
                    </svg>
                </button>
                <button class="header__actions-button">
                     <svg width="24px" height="24px">
                        <use class="header__actions-icon" href="./icons/sprite.svg#profile"></use>
                    </svg>
                </button>
            </div>
        </div>
    </header>
    <div class="hero">
        <div class="hero__container">
            <div class="container hero__container-flex">
                <div class="hero__info">
                    <h1 class="title hero__title">НАЙДИ ОДЕЖДУ <br> КОТОРАЯ ВЫРАЗИТ <br> ТВОЙ СТИЛЬ</h1>
                    <p class="text hero__text">Просмотрите наш набор тщательно сделанной одежды, созданный <br> чтобы подчеркнуть ваш индивидуальный стиль.</p>
                    <button class="button hero__button">Купить сейчас</button>
                    <div class="statistics">
                            <div class="statistics__container">
                                <article class="statistics__article statistics__article-brands">
                                    <h3 class="statistics__title">200+</h3>
                                    <p class="text statistics__text">
                                    Всемирных брендов
                                    </p>                        
                                </article>
                                <article class="statistics__article statistics__article-goods">
                                    <h3 class="statistics__title">2,000+</h3>
                                    <p class="text statistics__text">
                                    Качественных товаров
                                    </p>                    
                                </article>
                                <article class="statistics__article statistics__article-clients">
                                    <h3 class="statistics__title">30,000+<h3>
                                    <p class="text statistics__text">
                                    Счастливых клиентов
                                    </p>                        
                                </article>
                            </div>
                        </div>
                    </div>
                    <img class="hero__img--phone" src="./images/hero__img--phone.png" alt="">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
